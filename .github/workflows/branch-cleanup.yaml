name: Branch cleanup

# Deletes branches with no commit in two weeks, except ones still in use. The step summary
# lists what it deleted and what it kept. On a pull request, or when run by hand with
# dry_run, it deletes nothing.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/branch-cleanup.*"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/branch-cleanup.*"
  schedule:
    - cron: "7 9 * * *"
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, and delete nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest

    # Each dry run has a group of its own, so a pending run never replaces another of a
    # different kind
    concurrency:
      group: branch-cleanup-${{ (github.event_name == 'pull_request' || inputs.dry_run == true) && github.run_id || 'delete' }}

    permissions:
      contents: write
      pages: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/branch-cleanup.sh
          sparse-checkout-cone-mode: false

      - name: Delete stale branches
        env:
          CUTOFF_DAYS: "14"
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/branch-cleanup.sh
