name: jj-octo

on:
  pull_request:
  push:
    branches:
      - main

env:
  # The npm that publishes. Publishing with the workflow's identity needs npm 11.5.1 or later,
  # newer than the runner's own npm.
  # renovate: datasource=npm depName=npm
  NPM_VERSION: 12.2.1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # The same age renovate.json5 waits for before updating a dependency
          minimum_release_age: 3d

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `cd` publishes the version from the last commit of a push. So a pull request above a
      # release in a stack fails here until the release is merged, and the default branch's
      # required checks stop the two merging in one push. A pull request that changes the version
      # is a release, so the new version has to be higher than the base branch's, and one npm
      # doesn't have.
      - name: Check the version
        if: github.event_name == 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${GITHUB_BASE_REF}"
          export HEAD_VERSION BASE_VERSION DEFAULT_VERSION
          HEAD_VERSION=$(jq -r .version package.json)
          BASE_VERSION=$(git show "FETCH_HEAD:package.json" 2>/dev/null | jq -r .version || true)
          if [ -n "${BASE_VERSION}" ] && [ "${GITHUB_BASE_REF}" != "${DEFAULT_BRANCH}" ]; then
            git fetch --depth=1 origin "${DEFAULT_BRANCH}"
            DEFAULT_VERSION=$(git show FETCH_HEAD:package.json | jq -r .version)
            if [ "$(bun -e 'console.log(Bun.semver.order(process.env.BASE_VERSION, process.env.DEFAULT_VERSION))')" = 1 ]; then
              echo "::error::A pull request below this one raises the version to ${BASE_VERSION}. Merge it first, with nothing above it, then merge this one."
              exit 1
            fi
          fi
          if [ "${HEAD_VERSION}" = "${BASE_VERSION}" ]; then
            exit 0
          fi
          if [ -n "${BASE_VERSION}" ] && [ "$(bun -e 'console.log(Bun.semver.order(process.env.HEAD_VERSION, process.env.BASE_VERSION))')" != 1 ]; then
            echo "::error::version ${HEAD_VERSION} isn't higher than ${BASE_VERSION} on ${GITHUB_BASE_REF}"
            exit 1
          fi
          if [ -n "$(npm view "jj-octo@${HEAD_VERSION}" version 2>/dev/null || true)" ]; then
            echo "::error::npm already has jj-octo@${HEAD_VERSION}"
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Run the built file
        run: ./dist/jj-octo.js --version

      # `cd` runs only on main, so this runs the npm it publishes with on every pull request.
      - name: Pack with the publishing npm
        run: npx --yes "npm@${NPM_VERSION}" pack --dry-run --ignore-scripts

      # The archives a release attaches, so a target that fails to compile fails here, and the
      # release ships the executables the next job ran.
      - name: Compile for every platform
        run: bun run compile:release

      - name: Keep the executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executables
          path: dist/release
          if-no-files-found: error
          # A re-run of every job uploads them again.
          overwrite: true
          # Only this run's later jobs read them, including a re-run of `cd` within the week, and
          # the archives are compressed already.
          retention-days: 7
          compression-level: 0

  # Runs each standalone executable on its own platform, which `ci` can only compile for.
  executables:
    name: Executable on ${{ matrix.platform }}
    needs: ci
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: linux-x64, runner: ubuntu-latest }

    steps:
      - name: Download the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executables

      - name: Run the executable
        run: |
          tar -xzf jj-octo-${{ matrix.platform }}.tar.gz
          ./jj-octo --version

  # Publishes the version in package.json to npm, and as a GitHub release with the executables,
  # where either doesn't have it yet. Each is checked on its own, so a re-run finishes the other.
  cd:
    name: CD
    needs: [ci, executables]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write # For the tag and the GitHub release.
      id-token: write # npm takes the workflow's identity as its publish credential, so no token is stored.

    concurrency:
      group: cd

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # The same age renovate.json5 waits for before updating a dependency
          minimum_release_age: 3d

      # `npm view` prints nothing for a version the registry doesn't have, and fails for a
      # package it doesn't have. Both leave the output empty. `gh release view` prints `false` for a
      # published release, `true` for a draft, and nothing where there is none. The release is made
      # only from the commit npm published, here or in an earlier attempt.
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          published=$(npm view "jj-octo@${version}" version 2>/dev/null || true)
          echo "published=${published}" >> "$GITHUB_OUTPUT"
          published_from=$(npm view "jj-octo@${version}" gitHead 2>/dev/null || true)
          draft=$(gh release view "v${version}" --json isDraft --jq .isDraft 2>/dev/null || true)
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          if [ "${draft}" != false ] && { [ -z "${published}" ] || [ "${published_from}" = "${GITHUB_SHA}" ]; }; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.published == ''
        run: bun install --frozen-lockfile

      # bun can't publish with the workflow's identity, so npm does it. `prepack` builds the file.
      - name: Publish to npm
        if: steps.version.outputs.published == ''
        run: npx --yes "npm@${NPM_VERSION}" publish --access public --provenance

      - name: Download the executables
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executables
          path: executables

      - name: Create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ steps.version.outputs.draft }}
        # Releases are immutable once published, so gh uploads the executables to a draft and
        # then publishes it. A draft left by an upload that failed is replaced.
        run: |
          set -euo pipefail
          if [ "${DRAFT}" = true ]; then
            gh release delete "v${VERSION}" --yes
          fi
          gh release create "v${VERSION}" --generate-notes --target "${GITHUB_SHA}" executables/*
